---
# Collect the latest harvested exam notebook per group from the worker VMs.
# Participant data is never modified or deleted. A root-side helper selects and
# copies files without following symlinks into a root-owned scratch directory;
# only that scratch directory is fetched, then removed.
# Files go to a private staging directory on the control node; naming,
# verification and final placement are handled by collect-submissions.sh.
# Matching '<archive>.state.json' recorded-answer files are fetched best effort;
# trouble with them is only ever a warning.
- name: Collect latest assessment submissions per group and participant
  hosts: "{{ assessment_worker_group }}"
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: auto_silent
    assessment_storage_root: /var/lib/rancher/k3s/storage
    assessment_helper: "{{ playbook_dir }}/../scripts/workshops/assessment/collect_harvest.py"
  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - assessment_worker_group is match('^[A-Za-z_][A-Za-z0-9_-]*$')
          - assessment_staging_dir is match('^/[A-Za-z0-9/_.-]+$')
          - assessment_storage_root is match('^/[A-Za-z0-9/_.-]+$')
          - assessment_exam_stem is defined
          - assessment_exam_stem is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
        quiet: true

    - name: Select and copy the latest submissions without following symlinks
      ansible.builtin.script:
        cmd: "{{ assessment_helper }} --root {{ assessment_storage_root }} --stem {{ assessment_exam_stem }}"
      register: assessment_helper_run
      changed_when: false

    - name: Parse the helper manifest
      ansible.builtin.set_fact:
        assessment_manifest: "{{ assessment_helper_run.stdout | from_json }}"

    - name: Validate the helper manifest
      ansible.builtin.assert:
        that:
          - assessment_manifest.out_dir is none or assessment_manifest.out_dir is match('^/var/tmp/assessment-collect\.[A-Za-z0-9_]+$')
          - (assessment_manifest['items'] | length == 0) or (assessment_manifest.out_dir is not none)
          - (assessment_manifest['items'] | map(attribute='name') | select('match', '^group_[0-9]+(_p[0-9a-f]{16})?_[0-9]{8}T[0-9]{6}\.ipynb$') | list | length) == (assessment_manifest['items'] | length)
          - (assessment_manifest['items'] | map(attribute='sha256') | select('match', '^[0-9a-f]{64}$') | list | length) == (assessment_manifest['items'] | length)
          - (assessment_manifest['items'] | selectattr('state', 'defined') | map(attribute='state') | map(attribute='name') | select('match', '^group_[0-9]+(_p[0-9a-f]{16})?_[0-9]{8}T[0-9]{6}\.ipynb\.state\.json$') | list | length) == (assessment_manifest['items'] | selectattr('state', 'defined') | list | length)
          - (assessment_manifest['items'] | selectattr('state', 'defined') | map(attribute='state') | map(attribute='sha256') | select('match', '^[0-9a-f]{64}$') | list | length) == (assessment_manifest['items'] | selectattr('state', 'defined') | list | length)
        quiet: true

    - name: Fetch the copies and the manifest, then remove the worker scratch directory
      when: assessment_manifest.out_dir is not none
      block:
        - name: Fetch into the staging directory
          ansible.builtin.fetch:
            src: "{{ assessment_manifest.out_dir }}/{{ item }}"
            dest: "{{ assessment_staging_dir }}/{{ inventory_hostname }}/{{ item }}"
            flat: true
            validate_checksum: true
          loop: "{{ (assessment_manifest['items'] | map(attribute='name') | list + ['manifest.json']) if assessment_manifest['items'] else [] }}"
        - name: Fetch recorded-answer files (best effort; a failure is only a warning)
          ansible.builtin.fetch:
            src: "{{ assessment_manifest.out_dir }}/{{ item }}"
            dest: "{{ assessment_staging_dir }}/{{ inventory_hostname }}/{{ item }}"
            flat: true
            validate_checksum: true
          loop: "{{ assessment_manifest['items'] | selectattr('state', 'defined') | map(attribute='state') | map(attribute='name') | list }}"
          register: assessment_state_fetch
          ignore_errors: true

        - name: Report recorded-answer files that could not be fetched
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }}: recorded-answer file not fetched (notebooks unaffected): {{ assessment_state_fetch.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}"
          when: assessment_state_fetch.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
      always:
        - name: Remove the worker scratch directory (never participant data)
          ansible.builtin.file:
            path: "{{ assessment_manifest.out_dir }}"
            state: absent

    - name: Report problems found by the helper
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ assessment_manifest.problems }}"
      when: assessment_manifest.problems | length > 0

    - name: Report recorded-answer warnings from the helper (notebooks are still collected)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ assessment_manifest['warnings'] }}"
      when: (assessment_manifest['warnings'] | default([])) | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ (assessment_manifest['items'] | map(attribute='group') | unique | sort | join(', '))
             if assessment_manifest['items'] else 'no matching submissions' }}

    - name: Mark this host failed if the helper refused or skipped anything
      ansible.builtin.assert:
        that: assessment_manifest.problems | length == 0
        fail_msg: "{{ inventory_hostname }}: the helper reported problems (see above); the run is incomplete"
        quiet: true
