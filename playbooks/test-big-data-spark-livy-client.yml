# Organiser-only client test; never starts or stops shared services.
- name: Test one bounded organiser-controlled external Livy client
  hosts: '{{ big_data_worker_group }}'
  become: true
  gather_facts: true
  serial: 1
  vars_files:
  - ../roles/big_data_spark_runtime/defaults/main.yml
  tasks:
  - name: Require the reviewed platform and runtime inputs
    ansible.builtin.assert:
      that:
      - ansible_system == 'Linux'
      - ansible_architecture == 'x86_64'
      - (ansible_processor_vcpus | int) >= 4
      - (ansible_memtotal_mb | int) >= 7168
      - big_data_spark_project_name == 'digitafrica-spark'
      - big_data_spark_runtime_host_path == '/opt/digitafrica/big-data/runtime/spark'
      - big_data_spark_image == 'apache/spark@sha256:d0f5d63bfbbffdbec08debb4911554ba671a2fa7398374db8db314d80328f576'
      fail_msg: Direct execution requires the reviewed Linux x86_64 pilot and pinned Spark image.
  - name: Inspect the private Spark runtime without submitting work
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - "import json\nimport pathlib\nimport stat\nimport subprocess\nimport sys\n\nimage, runtime, project\
        \ = sys.argv[1:]\n\ndef require(condition, message):\n    if not condition:\n        raise RuntimeError(message)\n\
        \ndef run(args):\n    return subprocess.check_output(args, text=True, timeout=30)\n\ndef inspect(kind,\
        \ value):\n    return json.loads(run(['docker', kind, 'inspect', value]))[0]\n\nroot = pathlib.Path(runtime)\n\
        root_stat = root.lstat()\nrequire(stat.S_ISDIR(root_stat.st_mode) and root_stat.st_uid == 0,\n\
        \        'Runtime path must be a root-owned directory, not a symlink')\ncompose_path = root /\
        \ 'compose.yaml'\ncompose_stat = compose_path.lstat()\nrequire(stat.S_ISREG(compose_stat.st_mode)\n\
        \        and compose_stat.st_uid == 0 and compose_stat.st_gid == 0\n        and stat.S_IMODE(compose_stat.st_mode)\
        \ == 0o640,\n        'Compose file must be a root-owned regular file with mode 0640')\ncompose\
        \ = ['docker', 'compose', '--project-name', project,\n           '--file', str(compose_path)]\n\
        config = json.loads(run(compose + ['config', '--format', 'json']))\nservices = config['services']\n\
        worker_names = sorted(name for name in services\n                      if name in ('spark-worker-1',\
        \ 'spark-worker-2'))\nrequire(len(worker_names) in (1, 2) and 'spark-master' in services,\n  \
        \      'Expected one or two staged Spark workers and a master')\nrequire(set(services) <= {'spark-master',\
        \ 'spark-worker-1',\n                         'spark-worker-2', 'spark-livy'},\n        'Unexpected\
        \ staged service; review before direct execution')\nbase = inspect('image', image)\nrequire(base['Os']\
        \ == 'linux' and base['Architecture'] == 'amd64'\n        and image in base.get('RepoDigests',\
        \ []),\n        'Pinned linux/amd64 Spark image must already be present')\nnet_config = config['networks']['spark-private']\n\
        require(net_config.get('internal') is True,\n        'Staged Spark network must be internal')\n\
        network = inspect('network', net_config['name'])\nlabels = network.get('Labels') or {}\nrequire(network.get('Internal')\
        \ is True\n        and network.get('Driver') == 'bridge'\n        and labels.get('com.docker.compose.project')\
        \ == project\n        and labels.get('com.docker.compose.network') == 'spark-private',\n     \
        \   'Running network must be the organiser project private bridge')\ndataset = pathlib.Path('/opt/digitafrica/big-data/spark/data')\n\
        require(stat.S_ISDIR(dataset.lstat().st_mode),\n        'Dataset directory must exist and not\
        \ be a symlink')\ncsv_file = dataset / 'Bank_Personal_Loan_Modelling.csv'\nrequire(stat.S_ISREG(csv_file.lstat().st_mode),\n\
        \        'Expected CSV must be a regular file, not a symlink')\nrunning = {}\nfor service in ['spark-master']\
        \ + worker_names:\n    require(services[service]['image'] == image,\n            'Staged Spark\
        \ service uses an unexpected image')\n    ids = run(['docker', 'ps', '--quiet', '--filter',\n\
        \               'label=com.docker.compose.project=' + project,\n               '--filter', 'label=com.docker.compose.service='\
        \ + service]).split()\n    require(len(ids) == 1, 'Expected exactly one running ' + service)\n\
        \    container = inspect('container', ids[0])\n    require(container['State']['Running'] and container['Image']\
        \ == base['Id'],\n            'Running Spark service image differs from the pinned base')\n  \
        \  require(network['Name'] in container['NetworkSettings']['Networks'],\n            'Spark service\
        \ is not on the private network')\n    require(container['HostConfig']['NetworkMode'] != 'host',\n\
        \            'Host networking is not allowed')\n    expected_memory = 536870912 if service ==\
        \ 'spark-master' else 2147483648\n    require(container['HostConfig']['Memory'] == expected_memory,\n\
        \            'Spark service memory limit differs from the reviewed pilot')\n    if service !=\
        \ 'spark-master':\n        require(not container['HostConfig'].get('PortBindings'),\n        \
        \        'Worker ports must not be published')\n    mounts = container.get('Mounts', [])\n   \
        \ require(any(m.get('Type') == 'bind' and m.get('Source') == str(dataset)\n                and\
        \ m.get('Destination') == '/opt/spark-data/data'\n                and m.get('RW') is False for\
        \ m in mounts),\n            'Spark service is missing the shared read-only dataset mount')\n\
        \    running[service] = ids[0]\nprobe = ('import json, urllib.request; '\n         'r=urllib.request.urlopen(\"\
        http://spark-master:8080/json/\", timeout=5); '\n         'print(json.dumps(json.load(r)))')\n\
        master = json.loads(run(['docker', 'exec', running['spark-master'],\n                        \
        \ 'python3', '-c', probe]))\nworkers = master.get('workers', [])\nrequire(len(workers) == len(worker_names)\n\
        \        and all(w.get('state') == 'ALIVE' for w in workers),\n        'Master must report the\
        \ expected number of live workers')\nrequire('activeapps' in master and not master['activeapps'],\n\
        \        'Expected no active Spark applications before the organiser test')\nmemory = {}\nfor\
        \ line in pathlib.Path('/proc/meminfo').read_text().splitlines():\n    fields = line.split()\n\
        \    if fields[0] in ('MemTotal:', 'MemAvailable:'):\n        memory[fields[0].rstrip(':')] =\
        \ int(fields[1]) // 1024\nrequire(memory.get('MemAvailable', 0) >= 2048,\n        'Require at\
        \ least 2 GiB available RAM before adding a driver; no resources reserved')\nprint(json.dumps({\n\
        \    'status': 'preflight_passed',\n    'network': network['Name'],\n    'spark_image_id': base['Id'],\n\
        \    'spark_image_default_user': base.get('Config', {}).get('User'),\n    'spark_image_working_directory':\
        \ base.get('Config', {}).get('WorkingDir'),\n    'running_spark_containers': running,\n    'live_workers':\
        \ len(workers),\n    'active_applications': len(master['activeapps']),\n    'dataset_bytes': csv_file.stat().st_size,\n\
        \    'memory_mib_snapshot': memory,\n    'scope': 'read-only snapshot; no computation, reservation\
        \ or participant access tested'\n}))\n"
      - '{{ big_data_spark_image }}'
      - '{{ big_data_spark_runtime_host_path }}'
      - '{{ big_data_spark_project_name }}'
    register: spark_direct_preflight
    changed_when: false
  - name: Validate already staged runtime inputs without building
    ansible.builtin.import_tasks: tasks/big-data-livy-preflight.yml
  - name: Validate the already built Livy image
    ansible.builtin.import_tasks: tasks/big-data-livy-image-validation.yml
  - name: Require the fixed one-worker pilot and explicit server heap settings
    ansible.builtin.assert:
      that:
      - big_data_spark_project_name == 'digitafrica-spark'
      - (livy_build_worker_count | int) == 1
      - '''spark-worker-1'' in livy_build_compose.services'
      - livy_build_compose.services['spark-master'].image == big_data_spark_image
      - livy_build_compose.services['spark-livy'].environment.LIVY_SERVER_JAVA_OPTS == '-Xms128m -Xmx512m'
      fail_msg: Startup is restricted to the explicitly staged one-worker educational pilot with the reviewed
        heap settings.
  - name: Assemble the explicit Compose command prefix
    ansible.builtin.set_fact:
      livy_start_compose_argv:
      - docker
      - compose
      - --project-name
      - '{{ big_data_spark_project_name }}'
      - --file
      - '{{ big_data_spark_runtime_host_path }}/compose.yaml'
  - name: Check the limited pilot readiness evidence
    ansible.builtin.import_tasks: tasks/big-data-spark-livy-readiness.yml
  - name: Display external-client preflight evidence
    ansible.builtin.debug:
      msg:
        inventory_host: '{{ inventory_hostname }}'
        evidence: '{{ spark_direct_preflight.stdout | from_json }}'
        scope: Organiser-only separate client container; not participant access or capacity validation
  - name: Execute one bounded external-client Livy computation
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/../scripts/workshops/big-data/spark/step2-livy/container-runner.py'')
        }}'
      stdin: '{{ lookup(''ansible.builtin.file'', playbook_dir ~ ''/../workshop_assets/big-data/spark/beginner/02_spark_via_livy.py'')
        }}'
    register: spark_livy_client_result
    changed_when: (spark_livy_client_result.stdout | default('{}', true) | from_json).get('container_created',
      false)
    failed_when: false
  - name: Display computation and owned-resource cleanup evidence
    ansible.builtin.debug:
      msg:
        inventory_host: '{{ inventory_hostname }}'
        return_code: '{{ spark_livy_client_result.rc }}'
        stdout: '{{ spark_livy_client_result.stdout_lines }}'
        stderr: '{{ spark_livy_client_result.stderr_lines }}'
  - name: Require successful computation and confirmed owned-resource cleanup
    ansible.builtin.assert:
      that:
      - spark_livy_client_result.rc == 0
      - (spark_livy_client_result.stdout | from_json).get('status') == 'computation_passed'
      - (spark_livy_client_result.stdout | from_json).get('container_removed', false)
      - (spark_livy_client_result.stdout | from_json).get('session_removed', false)
      - (spark_livy_client_result.stdout | from_json).get('application_no_longer_active', false)
      fail_msg: Execution or cleanup failed. Inspect the owned container, session ID, application ID and
        evidence directory before retrying. Do not remove unrelated resources.
