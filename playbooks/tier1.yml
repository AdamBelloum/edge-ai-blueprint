# Tier-1 playbook — only touches tier1_server/tier1_agents hosts, only reads tier1.* and oidc.*
# Run standalone: ansible-playbook playbooks/tier1.yml

- name: Base setup on Tier-1 nodes
  hosts: tier1_server:tier1_agents
  vars: &tier1_deployment_vars
    digitafrica_deployment: "{{ tier1 }}"
    fl_workshop_server_group: "tier1_server"
    fl_workshop_client_group: "tier1_agents"
    workshop_notebook_runtime:
      enabled: false
  roles:
    - role: common
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Tier-1 k3s server (install)
  hosts: tier1_server
  vars: *tier1_deployment_vars
  roles:
    - role: k3s_server
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Tier-1 k3s agents (install)
  hosts: tier1_agents
  vars: *tier1_deployment_vars
  roles:
    - role: k3s_agent
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Deploy DIGITAfrica apps on Tier-1 (install)
  hosts: tier1_server
  vars: *tier1_deployment_vars
  roles:
    - role: fl_workshop_topology
      when: not (digitafrica_uninstall | default(false) | bool)
    - role: k8s_apps
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Deploy DIGITAfrica apps on Tier-1 (uninstall)
  hosts: tier1_server
  vars: *tier1_deployment_vars
  roles:
    - role: k8s_apps
      when: digitafrica_uninstall | default(false) | bool

- name: Tier-1 k3s agents (uninstall)
  hosts: tier1_agents
  vars: *tier1_deployment_vars
  roles:
    - role: k3s_agent
      when: digitafrica_uninstall | default(false) | bool

- name: Tier-1 k3s server (uninstall)
  hosts: tier1_server
  vars: *tier1_deployment_vars
  roles:
    - role: k3s_server
      when: digitafrica_uninstall | default(false) | bool

# ====================================================================
# AUTOMATED HOST DEPLOYMENT: FLOWER SERVER ON MASTER NODE (ab-01)
# ====================================================================
- name: Stage repository-owned Flower server source on the control plane
  hosts: tier1_server
  vars: *tier1_deployment_vars
  become: false
  pre_tasks:
    - name: Skip Flower server source staging during uninstall
      ansible.builtin.meta: end_play
      when: digitafrica_uninstall | default(false) | bool
  roles:
    - role: fl_workshop_server_assets

- name: Stage isolated Flower client assets on Tier-1 worker nodes
  hosts: tier1_agents
  vars: *tier1_deployment_vars
  become: true
  pre_tasks:
    - name: Skip Flower client asset staging during uninstall
      ansible.builtin.meta: end_play
      when: digitafrica_uninstall | default(false) | bool
  roles:
    - role: fl_workshop_client_assets

- name: Deploy Federated Learning Client Workspaces
  hosts: tier1_server
  vars: *tier1_deployment_vars
  become: false  # Use adam's existing kubectl configuration

  roles:
    - role: fl_workshop_topology
      when: not (digitafrica_uninstall | default(false) | bool)
    - role: jupyterhub_deployment
      when: not (digitafrica_uninstall | default(false) | bool)

# ====================================================================
# FLOWER SERVER RUNTIME: virtual environment on tier1_server
# ====================================================================
- name: Prepare Flower server virtual environment on Control Plane
  hosts: tier1_server
  vars: *tier1_deployment_vars
  become: false
  pre_tasks:
    - name: Skip Flower venv setup during uninstall
      ansible.builtin.meta: end_play
      when: digitafrica_uninstall | default(false) | bool
  roles:
    - role: fl_workshop_server_runtime
