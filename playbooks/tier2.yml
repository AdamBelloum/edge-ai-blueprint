---
# Tier-2 playbook — deploys an independent workshop cluster.
# It touches only tier2_server/tier2_agents and reads tier2.* plus oidc.*.
# Run standalone: ansible-playbook -i <tier2-inventory> playbooks/tier2.yml

- name: Base setup on Tier-2 nodes
  hosts: tier2_server:tier2_agents
  vars: &tier2_deployment_vars
    digitafrica_deployment: "{{ tier2 }}"
    fl_workshop_server_group: "tier2_server"
    fl_workshop_client_group: "tier2_agents"
    workshop_notebook_runtime:
      enabled: true
      image_name: "quay.io/jupyterhub/k8s-singleuser-sample"
      image_tag: "4.4.2"
  roles:
    - role: common
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Tier-2 k3s server (install)
  hosts: tier2_server
  vars: *tier2_deployment_vars
  roles:
    - role: k3s_server
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Tier-2 k3s agents (install)
  hosts: tier2_agents
  vars: *tier2_deployment_vars
  roles:
    - role: k3s_agent
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Deploy DIGITAfrica apps on Tier-2 (install)
  hosts: tier2_server
  vars: *tier2_deployment_vars
  roles:
    - role: fl_workshop_topology
      when: not (digitafrica_uninstall | default(false) | bool)
    - role: k8s_apps
      when: not (digitafrica_uninstall | default(false) | bool)

- name: Deploy DIGITAfrica apps on Tier-2 (uninstall)
  hosts: tier2_server
  vars: *tier2_deployment_vars
  roles:
    - role: k8s_apps
      when: digitafrica_uninstall | default(false) | bool

- name: Tier-2 k3s agents (uninstall)
  hosts: tier2_agents
  vars: *tier2_deployment_vars
  roles:
    - role: k3s_agent
      when: digitafrica_uninstall | default(false) | bool

- name: Tier-2 k3s server (uninstall)
  hosts: tier2_server
  vars: *tier2_deployment_vars
  roles:
    - role: k3s_server
      when: digitafrica_uninstall | default(false) | bool

# ====================================================================
# FLOWER SERVER ASSETS ON THE TIER-2 CONTROL PLANE
# ====================================================================
- name: Stage repository-owned Flower server source on the control plane
  hosts: tier2_server
  vars: *tier2_deployment_vars
  become: false
  pre_tasks:
    - name: Skip Flower server source staging during uninstall
      ansible.builtin.meta: end_play
      when: digitafrica_uninstall | default(false) | bool
  roles:
    - role: fl_workshop_server_assets

- name: Stage isolated Flower client assets on Tier-2 worker nodes
  hosts: tier2_agents
  vars: *tier2_deployment_vars
  become: true
  pre_tasks:
    - name: Skip Flower client asset staging during uninstall
      ansible.builtin.meta: end_play
      when: digitafrica_uninstall | default(false) | bool
  roles:
    - role: fl_workshop_client_assets

- name: Reconcile student-driven federated-learning workspaces
  hosts: tier2_server
  vars: *tier2_deployment_vars
  become: false  # Use adam's existing kubectl configuration

  roles:
    - role: fl_workshop_topology
      when: not (digitafrica_uninstall | default(false) | bool)
    - role: jupyterhub_deployment
      when: not (digitafrica_uninstall | default(false) | bool)

# ====================================================================
# FLOWER SERVER RUNTIME: virtual environment on tier2_server
# ====================================================================
- name: Prepare Flower server virtual environment on Control Plane
  hosts: tier2_server
  vars: *tier2_deployment_vars
  become: false
  pre_tasks:
    - name: Skip Flower venv setup during uninstall
      ansible.builtin.meta: end_play
      when: digitafrica_uninstall | default(false) | bool
  roles:
    - role: fl_workshop_server_runtime
