- name: Base setup on all nodes
  hosts: all
  roles:
    - common

- name: Tier-1 k3s server
  hosts: tier1
  roles:
    - role: k3s_server
      when: tier1_enable_k3s | bool

- name: Tier-0 optional k3s agent
  hosts: tier0
  roles:
    - role: k3s_agent
      when: tier0_enable_k3s | bool

- name: Deploy DIGITAfrica apps via k3s (only where enabled)
  hosts: tier1
  roles:
    - role: k8s_apps
      when: tier1_enable_k3s | bool

- name: Tier-0 fallback (no k3s) notebook via Docker
  hosts: tier0
  roles:
    - role: tier0_notebook_docker
      when: not (tier0_enable_k3s | bool)
    - role: monitoring
      when: not (tier0_enable_k3s | bool)  