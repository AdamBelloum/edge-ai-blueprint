- name: Plan or stage validated participant Spark credentials
  hosts: '{{ big_data_control_group }}'
  become: true
  gather_facts: false
  vars:
    big_data_credentials_action: plan
    big_data_spark_runtime_host_path: /opt/digitafrica/big-data/runtime/spark
    big_data_spark_project_name: digitafrica-spark
    big_data_spark_client_image: digitafrica/spark-client:3.5.3-ssh-v1
  tasks:
  - name: Require one selected control host and explicit staging context
    ansible.builtin.assert:
      that:
      - ansible_play_hosts_all | length == 1
      - big_data_credentials_namespace is defined
      - big_data_credentials_action in ['plan', 'apply', 'verify']
      - big_data_worker_group is defined
      fail_msg: Select one control host, a namespace, a worker group and plan/apply/verify.
  - name: Resolve the same ordered worker topology used by JupyterHub
    ansible.builtin.include_role:
      name: fl_workshop_topology
    vars:
      fl_workshop_client_group: '{{ big_data_worker_group }}'
  - name: Inspect running client key mounts and public identities
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - '{{ lookup(''file'', playbook_dir + ''/../scripts/workshops/big-data/spark/inspect_client_identity.py'')
        }}'
      - --runtime
      - '{{ big_data_spark_runtime_host_path }}'
      - --project
      - '{{ big_data_spark_project_name }}'
      - --expected-image
      - '{{ big_data_spark_client_image }}'
    loop: '{{ fl_workshop_client_hosts }}'
    delegate_to: '{{ item }}'
    register: spark_active_clients
    changed_when: false
  - name: Validate each local export and build its private group-bound payload
    ansible.builtin.command:
      argv:
      - '{{ ansible_playbook_python }}'
      - '{{ playbook_dir }}/../scripts/workshops/big-data/spark/build_credential_request.py'
      - --produce
      - --worker
      - '{{ active_client.item }}'
      - --group
      - '{{ ''group_%02d'' | format(ansible_loop.index) }}'
      - --node
      - '{{ hostvars[active_client.item].ansible_fqdn }}'
      - --expected-image
      - '{{ big_data_spark_client_image }}'
      stdin: '{{ active_client.stdout | from_json | to_json }}'
    loop: '{{ spark_active_clients.results }}'
    loop_control:
      loop_var: active_client
      extended: true
      label: '{{ active_client.item }}'
    delegate_to: localhost
    become: false
    vars:
      ansible_become: false
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
    register: spark_private_requests
    changed_when: false
    no_log: true
    failed_when: false
  - name: Initialise public export-validation statuses
    ansible.builtin.set_fact:
      spark_export_public_status: []
  - name: Reduce private results to public status fields
    ansible.builtin.set_fact:
      spark_export_public_status: "{{ spark_export_public_status + [{\n  'worker': validation_result.active_client.item\
        \ | default('unknown_worker'),\n  'ok': (validation_result.rc | default(-1)) == 0,\n  'reason': (\n    'validated'\
        \ if (validation_result.rc | default(-1)) == 0 else (\n      ((validation_result.stdout | from_json).reason\
        \ | default('source_process_failed'))\n      if (validation_result.stdout | default('', true) | trim).startswith('{')\n\
        \      else 'source_process_failed'\n    )\n  )\n}] }}"
    loop: '{{ spark_private_requests.results }}'
    loop_control:
      loop_var: validation_result
    no_log: true
  - name: Report public export-validation statuses
    ansible.builtin.debug:
      msg: '{{ spark_export_public_status }}'
  - name: Require all exports to validate before staging
    ansible.builtin.assert:
      that:
      - spark_export_public_status | length == fl_workshop_client_hosts | length
      - spark_export_public_status | selectattr('ok', 'equalto', false) | list | length == 0
      fail_msg: Export validation blocked; see public reasons. No staging performed.
  - name: Preflight all group Secrets and optionally stage them without replacement
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - '{{ lookup(''file'', playbook_dir + ''/../scripts/workshops/big-data/spark/stage_credential_secrets.py'')
        }}'
      stdin: "{{ {'namespace': big_data_credentials_namespace,\n    'operation': big_data_credentials_action,\n\
        \    'requests': spark_private_requests.results | map(attribute='stdout') | map('from_json') | list,\n \
        \   'helper_code': lookup('file', playbook_dir + '/../scripts/workshops/big-data/spark/reconcile_credentials.py')}\n\
        \   | to_json }}"
    register: spark_staging_summary
    changed_when: "big_data_credentials_action == 'apply' and (((spark_staging_summary.stdout | from_json).helper_action\
      \ != 'preserve') or\n ((spark_staging_summary.stdout | from_json).groups |\n  selectattr('action', 'equalto',\
      \ 'create') | list | length > 0))"
    no_log: true
  - name: Report only the sanitised staging summary
    ansible.builtin.debug:
      msg: '{{ spark_staging_summary.stdout | from_json }}'
