---
- name: Derive the ordered federated-learning client topology
  ansible.builtin.set_fact:
    fl_workshop_client_hosts: >-
      {{ groups[fl_workshop_client_group] | default([]) }}
  tags:
    - workshop_assets
    - workshop_seed

- name: Require at least one configured federated-learning client VM
  ansible.builtin.assert:
    that:
      - fl_workshop_client_hosts | length > 0
    fail_msg: >-
      No federated-learning client VMs are configured in
      [{{ fl_workshop_client_group }}].
  tags:
    - workshop_assets
    - workshop_seed

- name: Require unique client inventory aliases
  ansible.builtin.assert:
    that:
      - fl_workshop_client_hosts | length == (fl_workshop_client_hosts | unique | list | length)
    fail_msg: >-
      A federated-learning client inventory alias occurs more than once in
      [{{ fl_workshop_client_group }}]. Each client must have one unique alias.
  tags:
    - workshop_assets
    - workshop_seed

- name: Gather Kubernetes node identity for every workshop client
  ansible.builtin.setup:
    filter: ansible_fqdn
  loop: "{{ fl_workshop_client_hosts }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  run_once: true
  tags:
    - workshop_assets
    - workshop_seed

- name: Require a resolved Kubernetes node name for every workshop client
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_fqdn is defined
      - hostvars[item].ansible_fqdn | length > 0
    fail_msg: >-
      Workshop client {{ item }} has no resolved ansible_fqdn. A Kubernetes
      node name is required for deterministic participant-server placement.
  loop: "{{ fl_workshop_client_hosts }}"
  run_once: true
  tags:
    - workshop_assets
    - workshop_seed
