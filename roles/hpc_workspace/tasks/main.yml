---
- name: Ensure HPC participant source directories exist
  ansible.builtin.file:
    path: "{{ hpc_workspace_host_path }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ hpc_workspace_directories }}"

- name: Stage explicitly allowlisted HPC participant files
  ansible.builtin.copy:
    src: "{{ hpc_workspace_source }}/{{ item }}"
    dest: "{{ hpc_workspace_host_path }}/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0755' if item in ['OpenMP/helpers/openmp_start', 'MPI/helpers/mpi_start'] else '0644' }}"
  loop: "{{ hpc_workspace_files }}"
