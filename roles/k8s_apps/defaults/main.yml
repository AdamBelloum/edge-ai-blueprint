---
# Tier-1 compatibility default; standalone Tier-2 overrides this per play.
digitafrica_deployment: "{{ tier1 }}"

# Disabled by default to preserve existing Tier-1 user-image and spawn
# behaviour. Enabled deployments select a pinned requirements profile from the
# active workshop state before JupyterLab opens.
workshop_notebook_runtime:
  enabled: false
  image_name: "quay.io/jupyterhub/k8s-singleuser-sample"
  image_tag: "4.4.2"

# Kept separate from workshop_notebook_runtime because Tier playbooks override
# that deployment-specific dictionary with enabled state and image selection.
workshop_notebook_runtime_profiles:
  federated-learning:
    configmap_name: digitafrica-runtime-federated-learning
    requirements_source: workshop_assets/federated_learning/requirements.lock
  cloud-computing-soa:
    configmap_name: digitafrica-runtime-cloud-computing-soa
    requirements_source: workshop_assets/cloud_computing_soa/module1_rest_api/requirements.lock
