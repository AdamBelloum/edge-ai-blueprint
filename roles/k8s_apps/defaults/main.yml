---
# Tier-1 compatibility default; standalone Tier-2 overrides this per play.
digitafrica_deployment: "{{ tier1 }}"

# Disabled by default to preserve existing Tier-1 user-image and spawn
# behaviour. Enabled deployments select a pinned requirements profile from the
# active workshop state before JupyterLab opens.
workshop_notebook_runtime:
  enabled: false
  image_name: "quay.io/jupyterhub/k8s-singleuser-sample"
  image_tag: "4.4.2"

# Kept separate from workshop_notebook_runtime because Tier playbooks override
# that deployment-specific dictionary with enabled state and image selection.
workshop_notebook_runtime_profiles:
  federated-learning:
    configmap_name: digitafrica-runtime-federated-learning
    requirements_source: workshop_assets/federated-learning/runtime/requirements.lock
  cloud-computing-soa:
    configmap_name: digitafrica-runtime-cloud-computing-soa
    requirements_source: workshop_assets/cloud-computing-soa/module1-rest-api/requirements.lock

# Opt-in HPC runtime staging and pod integration; preserves other workshops.
hpc_runtime_enabled: false

# Module 5 asset delivery only; not OpenFaaS runtime or publication approval.
# Keep disabled while licensing and reference-lab validation remain pending.
cloud_module5_delivery_enabled: false

# Module 3 teaching-file delivery only; not lab execution readiness.
# Opt in after delivery wiring and safety tests are complete.
cloud_module3_delivery_enabled: false
