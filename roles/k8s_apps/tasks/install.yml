- name: Ensure manifest dir exists
  ansible.builtin.file:
    path: /opt/digitafrica/k8s
    state: directory
    mode: "0755"
  tags:
    - workshop_application_reconciliation

- name: Stage Traefik middleware manifest
  ansible.builtin.template:
    src: 05-traefik-middleware.yaml.j2
    dest: /opt/digitafrica/k8s/05-traefik-middleware.yaml
    mode: "0644"
  tags:
    - workshop_application_reconciliation

- name: Ensure tutorial asset staging directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/digitafrica/k8s-notebooks/beginner
    - /opt/digitafrica/k8s-notebooks/advanced
    - /opt/digitafrica/k8s-notebooks/solutions
    # introduction-to-ai/module2 tracks
    - /opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/beginner
    - /opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/advanced
    - /opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/solutions
    # introduction-to-ai/module3 tracks
    - /opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/beginner
    - /opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/advanced
    - /opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/solutions
    # cloud-computing-soa/module1 REST API tracks and shared test harness
    - /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/beginner
    - /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/advanced
    - /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/solutions
    - /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/tests
    # cloud-computing-soa/module2 microservices source staging
    - /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module2/source
    # ADD NEXT MODULE HERE — e.g. introduction-to-ai/module4/beginner|advanced|solutions
    # ADD NEW WORKSHOP HERE — e.g. data-science/module1/beginner|advanced|solutions
  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Stage beginner tutorial assets on central node
  ansible.builtin.copy:
    src: notebooks/beginner/
    dest: /opt/digitafrica/k8s-notebooks/beginner/
    mode: "0644"
  tags:
    - workshop_assets
    - workshop_application_reconciliation

