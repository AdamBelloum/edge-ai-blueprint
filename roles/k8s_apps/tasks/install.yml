# ---------------------------------------------------------------------------
# cloud-computing-soa / module2 Microservices and JWT Authentication staging
#
# The nested source tree remains canonical under workshop_assets/. Kubernetes
# ConfigMaps are flat, so the ConfigMap task below assigns explicit flat keys.
# JupyterHub reconstructs the participant-facing directory layout at spawn time.
# ---------------------------------------------------------------------------
- name: Stage Cloud Computing SOA Module 2 source assets on central node
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../workshop_assets/cloud_computing_soa/module2_microservices/"
    dest: /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module2/source/
    mode: "0644"
  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Remove runtime artefacts from staged Cloud Computing SOA Module 2 assets
  ansible.builtin.shell: |
    set -euo pipefail
    find /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module2/source \
      \( -type d -name keys -o -type d -name __pycache__ \) \
      -prune -exec rm -rf {} +
    find /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module2/source \
      -type f -name '*.py[cod]' -delete
  args:
    executable: /bin/bash
  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Create/update Cloud Computing SOA Module 2 asset ConfigMaps
  ansible.builtin.shell: |
    set -euo pipefail
    root=/opt/digitafrica/k8s-notebooks/cloud-computing-soa/module2/source

    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      create configmap digitafrica-notebooks-cloud-computing-soa-module2-beginner \
      --from-file=module2_readme_md="$root/README.md" \
      --from-file=module2_requirements_lock="$root/requirements.lock" \
      --from-file=module2_gitignore="$root/.gitignore" \
      --from-file=setup_local_keys_sh="$root/beginner/setup_local_keys.sh" \
      --from-file=auth_service_auth_py="$root/beginner/auth_service/auth.py" \
      --from-file=shortener_service_shortener_py="$root/beginner/shortener_service/shortener.py" \
      --from-file=upstream_participants_guide_md="$root/beginner/upstream-participants-guide.md" \
      --dry-run=client -o yaml | k3s kubectl apply -f -

    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      create configmap digitafrica-notebooks-cloud-computing-soa-module2-advanced \
      --from-file=module2_readme_md="$root/README.md" \
      --from-file=module2_requirements_lock="$root/requirements.lock" \
      --from-file=module2_gitignore="$root/.gitignore" \
      --from-file=setup_local_keys_sh="$root/advanced/setup_local_keys.sh" \
      --from-file=auth_service_auth_py="$root/advanced/auth_service/auth.py" \
      --from-file=shortener_service_shortener_py="$root/advanced/shortener_service/shortener.py" \
      --from-file=upstream_participants_guide_md="$root/advanced/upstream-participants-guide.md" \
      --dry-run=client -o yaml | k3s kubectl apply -f -

    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      create configmap digitafrica-notebooks-cloud-computing-soa-module2-solutions \
      --from-file=module2_readme_md="$root/README.md" \
      --from-file=module2_requirements_lock="$root/requirements.lock" \
      --from-file=module2_gitignore="$root/.gitignore" \
      --from-file=setup_local_keys_sh="$root/solutions/setup_local_keys.sh" \
      --from-file=auth_service_auth_py="$root/solutions/auth_service/auth.py" \
      --from-file=shortener_service_shortener_py="$root/solutions/shortener_service/shortener.py" \
      --dry-run=client -o yaml | k3s kubectl apply -f -

    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      create configmap digitafrica-notebooks-cloud-computing-soa-module2-tests \
      --from-file=read_from_csv="$root/shared/tests/read_from.csv" \
      --from-file=test_microservices_py="$root/shared/tests/test_microservices.py" \
      --from-file=test_ownership_isolation_py="$root/shared/tests/test_ownership_isolation.py" \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Generate tutorial asset provenance
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - <<'PYTHON_PROVENANCE'
    import hashlib
    import json
    from datetime import datetime, timezone
    from pathlib import Path

    asset_sets = {
        "/opt/digitafrica/k8s-notebooks/beginner": (
            "00_START_HERE.md",
            "01_Inspect_Local_Partition.ipynb",
            "02_Run_Federated_Client.ipynb",
        ),
        "/opt/digitafrica/k8s-notebooks/advanced": (
            "00_START_HERE.md",
            "01_Inspect_Local_Partition.ipynb",
            "02_Run_Federated_Client.ipynb",
        ),
        "/opt/digitafrica/k8s-notebooks/solutions": (
            "01_Inspect_Local_Partition_solution.ipynb",
            "02_Run_Federated_Client_solution.ipynb",
        ),
        # cloud-computing-soa/module1 REST API provenance entries
        "/opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/beginner": (
            "app.py",
            "upstream-participants-guide.md",
        ),
        "/opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/advanced": (
            "app.py",
            "upstream-participants-guide.md",
        ),
        "/opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/solutions": (
            "app.py",
        ),
        "/opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/tests": (
            "read_from.csv",
            "test_api.py",
        ),
        # introduction-to-ai/module2 provenance entries
        # To add module3: copy this block and replace module2 with module3 filenames.
        # To add a new workshop: copy this block and replace workshop/module path and filenames.
        "/opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/beginner": (
            "00_START_HERE.md",
            "02_foundations_of_ml_beginner.ipynb",
        ),
        "/opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/advanced": (
            "00_START_HERE.md",
            "02_foundations_of_ml_advanced.ipynb",
        ),
        "/opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/solutions": (
            "00_START_HERE.md",
            "02_foundations_of_ml_solutions.ipynb",
        ),
        # introduction-to-ai/module3 provenance entries
        "/opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/beginner": (
            "00_START_HERE.md",
            "01_from_features_to_neural_networks_beginner.ipynb",
            "02_training_generalisation_and_architectures_beginner.ipynb",
        ),
        "/opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/advanced": (
            "00_START_HERE.md",
            "01_from_features_to_neural_networks_advanced.ipynb",
            "02_training_generalisation_and_architectures_advanced.ipynb",
        ),
        "/opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/solutions": (
            "00_START_HERE.md",
            "01_from_features_to_neural_networks_solutions.ipynb",
            "02_training_generalisation_and_architectures_solutions.ipynb",
        ),
    }

    for root_string, asset_names in asset_sets.items():
        root = Path(root_string)
        assets = {}

        for name in asset_names:
            asset = root / name
            if not asset.is_file():
                raise SystemExit(f"missing staged tutorial asset: {asset}")
            assets[name] = hashlib.sha256(asset.read_bytes()).hexdigest()

        manifest_sha256 = hashlib.sha256(
            json.dumps(assets, sort_keys=True, separators=(",", ":")).encode("utf-8")
        ).hexdigest()

        destination = root / "WORKSHOP_VERSION.json"

        # Do not rewrite provenance when the staged asset set is identical.
        # This keeps ConfigMaps stable across routine reconciliations.
        if destination.is_file():
            try:
                existing = json.loads(destination.read_text(encoding="utf-8"))
            except (OSError, json.JSONDecodeError):
                existing = None

            if (
                isinstance(existing, dict)
                and existing.get("schema_version") == 1
                and existing.get("asset_manifest_sha256") == manifest_sha256
                and existing.get("assets") == assets
            ):
                continue

        provenance = {
            "schema_version": 1,
            "asset_version": f"sha256:{manifest_sha256}",
            "asset_manifest_sha256": manifest_sha256,
            "generated_at_utc": datetime.now(timezone.utc)
            .replace(microsecond=0)
            .isoformat()
            .replace("+00:00", "Z"),
            "assets": assets,
        }

        temporary = destination.with_suffix(".json.tmp")
        temporary.write_text(
            json.dumps(provenance, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        temporary.chmod(0o644)
        temporary.replace(destination)
    PYTHON_PROVENANCE
  args:
    executable: /bin/bash
  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Ensure workshop runtime profile staging directories exist
  ansible.builtin.file:
    path: "/opt/digitafrica/k8s-runtime/{{ item.key }}"
    state: directory
    mode: "0755"
  loop: "{{ workshop_notebook_runtime_profiles | dict2items }}"
  when: workshop_notebook_runtime.enabled | default(false) | bool
  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Stage locked workshop runtime requirement profiles
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.value.requirements_source }}"
    dest: "/opt/digitafrica/k8s-runtime/{{ item.key }}/requirements.lock"
    mode: "0644"
  loop: "{{ workshop_notebook_runtime_profiles | dict2items }}"
  when: workshop_notebook_runtime.enabled | default(false) | bool
  tags:
    - workshop_assets
    - workshop_application_reconciliation

# A tag-only application reconciliation skips the platform plays that
# normally gather worker facts. The Helm values map workshop groups to the
# inventory workers' Kubernetes node names, so collect only ansible_fqdn here.
- name: Gather workshop-worker facts for JupyterHub values rendering
  ansible.builtin.setup:
    filter:
      - ansible_fqdn
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups[fl_workshop_client_group] }}"
  tags:
    - workshop_application_reconciliation

- name: Render JupyterHub Helm values
  ansible.builtin.template:
    src: jhub-values.yaml.j2
    dest: /opt/digitafrica/k8s/jhub-values.yaml
    mode: "0600"
  tags:
    - workshop_seed
    - workshop_application_reconciliation

- name: Install helm if missing
  ansible.builtin.shell: |
    set -e
    if ! command -v helm >/dev/null 2>&1; then
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    fi
    helm version
  args:
    executable: /bin/bash

- name: Ensure namespace exists
  ansible.builtin.shell: |
    set -e
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    k3s kubectl get ns {{ digitafrica_deployment.digitafrica_namespace }} >/dev/null 2>&1 || k3s kubectl create ns {{ digitafrica_deployment.digitafrica_namespace }}
  args:
    executable: /bin/bash
  tags:
    - workshop_application_reconciliation

- name: Verify protected JupyterHub OIDC client secret record
  ansible.builtin.assert:
    that:
      - oidc.oidc_client_secret_file is defined
      - oidc.oidc_client_secret_file | length > 0
      - lookup('ansible.builtin.file', oidc.oidc_client_secret_file) | trim | length > 0
    fail_msg: >-
      Managed OIDC requires the protected local JupyterHub client-secret record.
      Run keycloak-bootstrap.sh before deploying the applications phase.
  no_log: true
  when: oidc.oidc_enabled | default(false) | bool

- name: Create or update JupyterHub OIDC Kubernetes Secret
  ansible.builtin.shell: |
    set -euo pipefail
    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      create secret generic jupyterhub-oidc \
      --from-literal=client-id={{ oidc.oidc_client_id | quote }} \
      --from-literal=client-secret={{ lookup('ansible.builtin.file', oidc.oidc_client_secret_file) | trim | quote }} \
      --dry-run=client -o yaml | \
      k3s kubectl apply -f -
  args:
    executable: /bin/bash
  no_log: true
  when: oidc.oidc_enabled | default(false) | bool

- name: Create/update tutorial asset ConfigMaps
  ansible.builtin.shell: |
    set -euo pipefail
    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} create configmap {{ item.name }} \
      --from-file={{ item.path }}/ \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  loop:
    - name: digitafrica-notebooks-beginner
      path: /opt/digitafrica/k8s-notebooks/beginner
    - name: digitafrica-notebooks-advanced
      path: /opt/digitafrica/k8s-notebooks/advanced
    - name: digitafrica-notebooks-solutions
      path: /opt/digitafrica/k8s-notebooks/solutions
    # cloud-computing-soa/module1 REST API tracks and shared test harness
    - name: digitafrica-notebooks-cloud-computing-soa-module1-beginner
      path: /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/beginner
    - name: digitafrica-notebooks-cloud-computing-soa-module1-advanced
      path: /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/advanced
    - name: digitafrica-notebooks-cloud-computing-soa-module1-solutions
      path: /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/solutions
    - name: digitafrica-notebooks-cloud-computing-soa-module1-tests
      path: /opt/digitafrica/k8s-notebooks/cloud-computing-soa/module1/tests
    # introduction-to-ai/module2 ConfigMaps
    # To add module3: copy this block and replace module2 with module3.
    # To add a new workshop: copy this block and replace the workshop/module path.
    - name: digitafrica-notebooks-introduction-to-ai-module2-beginner
      path: /opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/beginner
    - name: digitafrica-notebooks-introduction-to-ai-module2-advanced
      path: /opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/advanced
    - name: digitafrica-notebooks-introduction-to-ai-module2-solutions
      path: /opt/digitafrica/k8s-notebooks/introduction-to-ai/module2/solutions
    # introduction-to-ai/module3 ConfigMaps
    - name: digitafrica-notebooks-introduction-to-ai-module3-beginner
      path: /opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/beginner
    - name: digitafrica-notebooks-introduction-to-ai-module3-advanced
      path: /opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/advanced
    - name: digitafrica-notebooks-introduction-to-ai-module3-solutions
      path: /opt/digitafrica/k8s-notebooks/introduction-to-ai/module3/solutions
  register: tutorial_asset_configmaps
  changed_when: >-
    'created' in tutorial_asset_configmaps.stdout or
    'configured' in tutorial_asset_configmaps.stdout

  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Create initial workshop tutorial state when absent
  ansible.builtin.shell: |
    set -euo pipefail
    if k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      get configmap digitafrica-workshop-state >/dev/null 2>&1; then
      echo "preserved"
    else
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
        create configmap digitafrica-workshop-state \
        --from-literal=workshop_type=none \
        --from-literal=workshop_module=none \
        --from-literal=mode=beginner \
        --from-literal=solutions_released=false
      echo "created"
    fi
  args:
    executable: /bin/bash
  register: workshop_tutorial_state_configmap
  changed_when: "'created' in workshop_tutorial_state_configmap.stdout"
  tags:
    - workshop_assets
    - workshop_application_reconciliation
    - workshop_state_migration

- name: Add neutral workshop type to existing workshop state when absent
  ansible.builtin.shell: |
    set -euo pipefail
    workshop_type="$(
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
        get configmap digitafrica-workshop-state \
        -o jsonpath='{.data.workshop_type}'
    )"

    case "$workshop_type" in
      '')
        k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
          patch configmap digitafrica-workshop-state \
          --type merge \
          -p '{"data":{"workshop_type":"none"}}'
        echo "initialised"
        ;;
      none|introduction-to-ai|federated-learning|cloud-computing-soa)
        echo "preserved"
        ;;
      *)
        printf 'Unsupported workshop_type in digitafrica-workshop-state: %s\n' \
          "$workshop_type" >&2
        exit 1
        ;;
    esac
  args:
    executable: /bin/bash
  register: workshop_type_state_configmap
  changed_when: "'initialised' in workshop_type_state_configmap.stdout"
  tags:
    - workshop_assets
    - workshop_application_reconciliation
    - workshop_state_migration

- name: Add generic workshop module selector when absent
  ansible.builtin.shell: |
    set -euo pipefail
    workshop_type="$(
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
        get configmap digitafrica-workshop-state \
        -o jsonpath='{.data.workshop_type}'
    )"
    workshop_module="$(
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
        get configmap digitafrica-workshop-state \
        -o jsonpath='{.data.workshop_module}'
    )"
    legacy_introduction_to_ai_module="$(
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
        get configmap digitafrica-workshop-state \
        -o jsonpath='{.data.introduction_to_ai_module}'
    )"

    case "$workshop_module" in
      none|module1|module2|module3)
        echo "preserved"
        exit 0
        ;;
      '')
        ;;
      *)
        printf 'Unsupported workshop_module in digitafrica-workshop-state: %s\n' \
          "$workshop_module" >&2
        exit 1
        ;;
    esac

    case "$workshop_type" in
      introduction-to-ai)
        case "$legacy_introduction_to_ai_module" in
          module1|module2|module3)
            workshop_module="$legacy_introduction_to_ai_module"
            ;;
          '')
            workshop_module=module1
            ;;
          *)
            printf 'Unsupported legacy Introduction to AI module in digitafrica-workshop-state: %s\n' \
              "$legacy_introduction_to_ai_module" >&2
            exit 1
            ;;
        esac
        ;;
      cloud-computing-soa)
        workshop_module=module1
        ;;
      none|federated-learning)
        workshop_module=none
        ;;
      *)
        printf 'Unsupported workshop_type while migrating workshop_module: %s\n' \
          "$workshop_type" >&2
        exit 1
        ;;
    esac

    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      patch configmap digitafrica-workshop-state \
      --type merge \
      -p "{\"data\":{\"workshop_module\":\"${workshop_module}\"}}"
    echo "initialised"
  args:
    executable: /bin/bash
  register: workshop_module_state_configmap
  changed_when: "'initialised' in workshop_module_state_configmap.stdout"
  tags:
    - workshop_assets
    - workshop_application_reconciliation
    - workshop_state_migration

- name: Create initial Introduction to AI Module 1 ConfigMap when absent
  ansible.builtin.shell: |
    set -euo pipefail
    if k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
      get configmap digitafrica-introduction-to-ai-module1 >/dev/null 2>&1; then
      echo "preserved"
    else
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} \
        create configmap digitafrica-introduction-to-ai-module1 \
        --from-literal=README.txt='Module 1 has not yet been published by the organiser.'
      echo "created"
    fi
  args:
    executable: /bin/bash
  register: introduction_to_ai_module1_configmap
  changed_when: "'created' in introduction_to_ai_module1_configmap.stdout"
  tags:
    - workshop_assets
    - workshop_application_reconciliation

- name: Create/update workshop runtime requirements ConfigMaps
  ansible.builtin.shell: |
    set -euo pipefail
    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} create configmap {{ item.value.configmap_name }} \
      --from-file=requirements.lock=/opt/digitafrica/k8s-runtime/{{ item.key }}/requirements.lock \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  loop: "{{ workshop_notebook_runtime_profiles | dict2items }}"
  when: workshop_notebook_runtime.enabled | default(false) | bool
  tags:
    - workshop_assets
    - workshop_application_reconciliation

# When servicelb is disabled, Traefik's LoadBalancer service stays <pending>.
# Patching externalIPs makes kube-proxy route host traffic on port 80/443 to Traefik.
- name: Wait for Traefik service to exist before patching externalIPs
  ansible.builtin.shell: |
    set -e
    for i in $(seq 1 60); do
      k3s kubectl -n kube-system get svc traefik >/dev/null 2>&1 && exit 0
      sleep 5
    done
    echo "Timed out waiting for Traefik service" && exit 1
  args:
    executable: /bin/bash
  changed_when: false
  when: digitafrica_deployment.expose_mode == 'ingress'

- name: Assign node IP as externalIP on Traefik service (servicelb disabled)
  ansible.builtin.shell: |
    set -e
    k3s kubectl -n kube-system patch svc traefik --type=merge \
      -p "{\"spec\":{\"externalIPs\":[\"{{ ansible_host | default(inventory_hostname) }}\"]}}"
  args:
    executable: /bin/bash
  when: digitafrica_deployment.expose_mode == 'ingress'
  changed_when: false

# ── TLS: self-signed ──────────────────────────────────────────────────────────
- name: Generate self-signed TLS certificate
  ansible.builtin.shell: |
    set -e
    mkdir -p /opt/digitafrica/tls
    if [ ! -f /opt/digitafrica/tls/tls.key ]; then
      openssl req -x509 -newkey rsa:4096 \
        -keyout /opt/digitafrica/tls/tls.key \
        -out /opt/digitafrica/tls/tls.crt \
        -days 3650 -nodes \
        -subj "/CN={{ ansible_host | default(inventory_hostname) }}" \
        -addext "subjectAltName=IP:{{ ansible_host | default(inventory_hostname) }}"
    fi
  args:
    executable: /bin/bash
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.tls_mode | default('none') == 'selfsigned'

- name: Create/update jhub-tls secret (self-signed)
  ansible.builtin.shell: |
    set -e
    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} create secret tls jhub-tls \
      --cert=/opt/digitafrica/tls/tls.crt \
      --key=/opt/digitafrica/tls/tls.key \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.tls_mode | default('none') == 'selfsigned'

# ── TLS: provided (user supplies their own cert) ───────────────────────────────
- name: Copy provided TLS certificate files to server
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/digitafrica/tls/{{ item | basename }}"
    mode: "0600"
  loop:
    - "{{ digitafrica_deployment.tls_cert_dir }}/tls.crt"
    - "{{ digitafrica_deployment.tls_cert_dir }}/tls.key"
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.tls_mode | default('none') == 'provided'

- name: Create/update jhub-tls secret (provided cert)
  ansible.builtin.shell: |
    set -e
    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} create secret tls jhub-tls \
      --cert=/opt/digitafrica/tls/tls.crt \
      --key=/opt/digitafrica/tls/tls.key \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.tls_mode | default('none') == 'provided'

# ── TLS: Let's Encrypt via cert-manager ───────────────────────────────────────
- name: Install cert-manager via Helm (Let's Encrypt)
  ansible.builtin.shell: |
    set -e
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    helm repo add jetstack https://charts.jetstack.io || true
    helm repo update
    helm upgrade --install cert-manager jetstack/cert-manager \
      --namespace cert-manager --create-namespace \
      --set installCRDs=true \
      --wait --timeout 5m
  args:
    executable: /bin/bash
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.tls_mode | default('none') == 'letsencrypt'

- name: Write Let's Encrypt ClusterIssuer manifest
  ansible.builtin.copy:
    content: |
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: {{ digitafrica_deployment.tls_acme_email }}
          privateKeySecretRef:
            name: letsencrypt-prod-key
          solvers:
            - http01:
                ingress:
                  class: traefik
    dest: /opt/digitafrica/k8s/letsencrypt-issuer.yaml
    mode: "0644"
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.tls_mode | default('none') == 'letsencrypt'

- name: Apply Let's Encrypt ClusterIssuer
  ansible.builtin.shell: |
    set -e
    k3s kubectl apply -f /opt/digitafrica/k8s/letsencrypt-issuer.yaml
  args:
    executable: /bin/bash
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.tls_mode | default('none') == 'letsencrypt'

- name: Add JupyterHub helm repo and update
  ansible.builtin.shell: |
    set -e
    helm repo add jupyterhub https://hub.jupyter.org/helm-chart/ || true
    helm repo update
  args:
    executable: /bin/bash

# One-time migration only: never remove Helm-managed resources during routine reconciliation.
# Set digitafrica_cleanup_legacy_jupyterhub_resources: true explicitly when needed.
- name: Cleanup previous manual JupyterHub resources (best-effort)
  ansible.builtin.shell: |
    set -e
    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} delete all,cm,secret,role,rolebinding,sa \
      -l app=jupyterhub --ignore-not-found || true
  args:
    executable: /bin/bash
  when: digitafrica_cleanup_legacy_jupyterhub_resources | default(false) | bool

- name: Apply Traefik redirect-slash middleware for JupyterHub
  ansible.builtin.shell: |
    set -e
    k3s kubectl apply -f /opt/digitafrica/k8s/05-traefik-middleware.yaml
  args:
    executable: /bin/bash
  when: digitafrica_deployment.expose_mode == 'ingress'
  tags:
    - workshop_application_reconciliation

- name: Install/upgrade JupyterHub via Helm (NodePort)
  ansible.builtin.shell: |
    set -e
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    helm upgrade --install jhub jupyterhub/jupyterhub \
      --namespace {{ digitafrica_deployment.digitafrica_namespace }} \
      {% if jupyterhub_chart_version | default('') | trim | length > 0 %}
      --version {{ jupyterhub_chart_version | quote }} \
      {% endif %}
      --timeout 15m0s \
      -f /opt/digitafrica/k8s/jhub-values.yaml
  args:
    executable: /bin/bash
  tags:
    - workshop_seed
    - workshop_application_reconciliation

- name: List resources created by Helm release (debug)
  ansible.builtin.shell: |
    set -e
    k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} get deploy,sts,po,svc -o wide
    echo "----"
    helm -n {{ digitafrica_deployment.digitafrica_namespace }} status jhub || true
  args:
    executable: /bin/bash
  become: true
  changed_when: false

- name: Wait for all JupyterHub deployments from release to finish rolling out
  ansible.builtin.shell: |
    set -e
    # Find deployments created by this helm release
    deps=$(k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} get deploy \
      -l app.kubernetes.io/instance=jhub \
      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}')
    if [ -z "$deps" ]; then
      echo "No deployments found for release jhub in namespace {{ digitafrica_deployment.digitafrica_namespace }}"
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} get all
      exit 1
    fi

    for d in $deps; do
      echo "Waiting for deployment/$d"
      k3s kubectl -n {{ digitafrica_deployment.digitafrica_namespace }} rollout status deploy/$d --timeout=600s
    done
  args:
    executable: /bin/bash
  become: true
  tags:
    - workshop_application_reconciliation

- name: Show access URL (NodePort)
  ansible.builtin.debug:
    msg:
      - "JupyterHub URL: http://{{ ansible_host | default(inventory_hostname) }}:{{ digitafrica_deployment.jupyterhub.jupyter_nodeport }}"
  when: digitafrica_deployment.expose_mode == 'nodeport'

- name: Show JupyterHub URL (Ingress)
  ansible.builtin.debug:
    msg: "JupyterHub URL: {{ digitafrica_deployment.jupyterhub.jupyterhub_public_url }}/"
  when: digitafrica_deployment.expose_mode == 'ingress'

- name: Show MLflow URL (Ingress)
  ansible.builtin.debug:
    msg: "MLflow URL:     https://mlflow.{{ digitafrica_deployment.digitafrica_namespace }}.eu  (configure DNS → {{ ansible_host | default(inventory_hostname) }})"
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.mlflow.enabled | default(false) | bool

- name: Show Grafana URL (Ingress)
  ansible.builtin.debug:
    msg: "Grafana URL:    https://grafana.{{ digitafrica_deployment.digitafrica_namespace }}.eu  (configure DNS → {{ ansible_host | default(inventory_hostname) }})"
  when: digitafrica_deployment.expose_mode == 'ingress' and digitafrica_deployment.grafana_enabled | default(false) | bool
