---
# Identity is deliberately separate from workshop applications:
#   identity     = Keycloak, PostgreSQL, TLS, ingress, readiness
#   applications = JupyterHub, workshop assets, OIDC Secret, Helm release
#
# Full deployments execute both includes in this order.

- name: Reconcile managed Keycloak identity infrastructure
  ansible.builtin.include_tasks:
    file: identity.yml
    apply:
      tags:
        - identity
  tags:
    - identity

- name: Reconcile workshop applications
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags:
        - applications
  tags:
    - applications
    - workshop_assets
    - workshop_state_migration

- name: Reconcile the current workshop cohort JupyterHub mapping
  ansible.builtin.include_tasks:
    file: cohort_mapping.yml
    apply:
      tags:
        - workshop_cohort
  tags:
    - workshop_cohort
  when: not (digitafrica_uninstall | default(false) | bool)
