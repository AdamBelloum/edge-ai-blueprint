---
# JupyterHub now creates student-controlled Flower clients on demand. This role
# verifies the client-node topology and removes the legacy autonomous Silo pods.

- name: Validate that at least one federated-learning client VM is configured
  ansible.builtin.assert:
    that:
      - fl_workshop_client_hosts is defined
      - fl_workshop_client_hosts | length > 0
    fail_msg: >-
      No federated-learning client VMs are configured in
      [{{ fl_workshop_client_group }}].

- name: Verify every configured client VM is a Ready Kubernetes node
  ansible.builtin.command:
    cmd: >-
      kubectl wait --for=condition=Ready
      node/{{ hostvars[item].ansible_fqdn | default(item) }} --timeout=30s
  loop: "{{ fl_workshop_client_hosts }}"
  changed_when: false

- name: List legacy autonomous Flower Silo deployments
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ digitafrica_deployment.digitafrica_namespace }}
      get deployment
      -l app=fl-client-silo
      -o custom-columns=NAME:.metadata.name
      --no-headers
  register: fl_legacy_silos
  changed_when: false

- name: Remove legacy autonomous Flower Silo deployments
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ digitafrica_deployment.digitafrica_namespace }}
      delete deployment {{ item }}
      --ignore-not-found=true
  loop: "{{ fl_legacy_silos.stdout_lines }}"
  register: fl_legacy_silo_delete
  changed_when: "'deleted' in fl_legacy_silo_delete.stdout"

- name: Find obsolete rendered Flower Silo manifests
  ansible.builtin.find:
    paths: /home/adam
    patterns: "fl-client-silo-*.yml"
    file_type: file
  register: fl_legacy_silo_manifests

- name: Remove obsolete rendered Flower Silo manifests
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ fl_legacy_silo_manifests.files }}"
