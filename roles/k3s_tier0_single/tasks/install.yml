- name: Install k3s server (Tier-0 single node)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ tier0.k3s_version }}" sh -s - server \
      --write-kubeconfig-mode 644 \
      {% if tier0.expose_mode == 'ingress' %} --disable servicelb {% endif %} \
      {% if tier0.expose_mode != 'ingress' %} --disable traefik {% endif %}
  args:
    creates: /usr/local/bin/k3s