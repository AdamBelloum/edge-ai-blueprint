---
# Verified on linux/amd64: Spark 3.5.3, Scala 2.12.18,
# Java 11.0.24 and bundled Python 3.8.10.
# Preparation does not change Docker service enablement or start containers.
big_data_spark_image: "apache/spark@sha256:d0f5d63bfbbffdbec08debb4911554ba671a2fa7398374db8db314d80328f576"

# Organiser-controlled runtime files must remain outside the participant seed
# directory /opt/digitafrica/big-data/spark.
big_data_spark_runtime_host_path: /opt/digitafrica/big-data/runtime/spark

# BEGIN managed Spark Compose staging
# Private pilot cluster. Notebook access and submission are not enabled here.
big_data_spark_project_name: digitafrica-spark
big_data_spark_worker_count: 2
big_data_spark_master_ui_loopback_port: 18080
# Hard container limits, not memory reservations. Two workers plus the master
# have a combined 4.5 GiB limit; driver/JupyterHub resources are separate.
big_data_spark_master_container_memory: 512m
big_data_spark_worker_container_memory: 2048m
# Each worker advertises one core and 1 GiB for Spark executors; its container
# limit also leaves room for the worker daemon and executor overhead.
# END managed Spark Compose staging

# BEGIN managed Livy release lock
# Opt-in: preparation must continue to stage only, never start services.
big_data_livy_enabled: false
big_data_livy_version: "0.9.0-incubating"
big_data_livy_archive_url: "https://archive.apache.org/dist/incubator/livy/0.9.0-incubating/apache-livy-0.9.0-incubating_2.12-bin.zip"
big_data_livy_archive_sha512: "50151be834bba3011fccbb564c3c9d6bf7a08af468c2082604f3c5b40ba95705a4c2e925e835bd58a58abcbeb18f3ab7bf588e01fa4f778ff9e82a4b91b9d2de"
# Locally built from the locked Spark base and verified Livy archive.
big_data_livy_image: "digitafrica/livy:0.9.0-incubating-spark3.5.3"
big_data_livy_container_memory: "2048m"
# END managed Livy release lock
