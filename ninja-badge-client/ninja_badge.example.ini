; Copy to ninja_badge.ini (same folder you run from) or ~/.ninja_badge.ini
; Environment variables override these values:
;   NINJA_BADGE_API_KEY, NINJA_BADGE_API_BASE_URL,
;   NINJA_BADGE_PASS_TEMPLATE_ID, NINJA_BADGE_PARTICIPATION_TEMPLATE_ID
;
; Get the API key in the BADGES.ninja dashboard (Settings > API keys, starts with "bws_").
; Get the badge IDs with:  python -m ninja_badge_issuer --list-badges
; (either the GUID or the full https://api.badges.ninja/certify-badge/badge/<guid> URL works)
[ninja_badge]
api_key =
base_url = https://api.badges.ninja
pass_template_id =
participation_template_id =
